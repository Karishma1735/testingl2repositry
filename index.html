    <meta name="theme-color" content="#faf4ee" />
    <script>
      const startsInDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = startsInDarkMode ? 'dark' : 'light';
      document.documentElement.classList.toggle('dark', startsInDarkMode);
      document.querySelector('meta[name="theme-color"]')?.setAttribute('content', startsInDarkMode ? '#1b1426' : '#faf4ee');
    </script>
